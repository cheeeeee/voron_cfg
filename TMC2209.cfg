########################################
# TMC2209 Stepper Driver Configuration
# Manta M8P V2.0 Stepper Slots
########################################

# Motor1 - Stepper X (B Motor)
# MOONS 17HS19-2004S1 rated 2.0A/phase
[tmc2209 stepper_x]
uart_pin: PC13
diag_pin: ^PF4 
driver_SGTHRS: 55
interpolate: False
run_current: 1.000
stealthchop_threshold: 0

# Motor2 - Stepper Y (A Motor)
# MOONS 17HS19-2004S1 rated 2.0A/phase
[tmc2209 stepper_y]
uart_pin: PE3
diag_pin: ^PF3
driver_SGTHRS: 55
interpolate: False
run_current: 1.000
stealthchop_threshold: 0

# Motor3 - Stepper Z0 (Front Left)
[tmc2209 stepper_z]
uart_pin: PB9
interpolate: False
run_current: 0.800
stealthchop_threshold: 0

# Motor5 - Stepper Z1 (Rear Left)
[tmc2209 stepper_z1]
uart_pin: PG14
interpolate: False
run_current: 0.800
stealthchop_threshold: 0

# Motor6 - Stepper Z2 (Rear Right)
[tmc2209 stepper_z2]
uart_pin: PG10
interpolate: False
run_current: 0.800
stealthchop_threshold: 0

# Motor7 - Stepper Z3 (Front Right)
[tmc2209 stepper_z3]
uart_pin: PD5
interpolate: False
run_current: 0.800
stealthchop_threshold: 0
