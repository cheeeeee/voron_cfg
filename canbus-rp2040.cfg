# This file contains pin mappings for the BIGTREETECH EBB SB2209 CAN (RP2040)
# micro-controller on the toolhead.

[mcu EBBCan]
canbus_uuid: 4cc248f5b9f1

# CAN bus power rail control - HE3 header (PA5)
[output_pin canbus_power]
pin: PA5
value: 1
shutdown_value: 1

# Onboard thermistor on EBB CAN board
[temperature_sensor EBB_NTC]
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio28

[adxl345]
cs_pin: EBBCan:gpio1
spi_software_sclk_pin: EBBCan:gpio2
spi_software_mosi_pin: EBBCan:gpio0
spi_software_miso_pin: EBBCan:gpio3
axes_map: z,-y,x

[resonance_tester]
probe_points: 175, 175, 50
accel_chip: adxl345

[input_shaper]
shaper_freq_x: 90.6
shaper_type_x: 3hump_ei
shaper_freq_y: 71.6
shaper_type_y: 3hump_ei

# Part cooling fan
[fan]
pin: EBBCan:gpio13

# Hotend cooling fan
[heater_fan hotend_fan]
pin: EBBCan:gpio14
heater: extruder
heater_temp: 50.0

[extruder]
step_pin: EBBCan:gpio18
dir_pin: EBBCan:gpio19
enable_pin: !EBBCan:gpio17
microsteps: 32
gear_ratio: 50:10
rotation_distance: 21.99631467189
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:gpio7
sensor_type: MAX31865
sensor_pin: EBBCan:gpio9
spi_software_sclk_pin: EBBCan:gpio10
spi_software_mosi_pin: EBBCan:gpio8
spi_software_miso_pin: EBBCan:gpio11
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
min_temp: -100
max_temp: 300
max_extrude_cross_section: 6
max_extrude_only_distance: 100
pressure_advance: 0.04  # Calibrate per filament with PA tuning tower
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: EBBCan:gpio20
run_current: 0.60
interpolate: False

###################################
# 	Filament Sensor 
###################################

[filament_switch_sensor filament_sensor]
switch_pin: EBBCan:gpio21
pause_on_runout: false
runout_gcode: M600