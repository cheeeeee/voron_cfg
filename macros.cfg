#####################################################################
#   Macros - Voron 2.4 (350x310) with Phaetus Dragon UHF & Voron Tap
#####################################################################

# -------------------------------------------------------------------
# Mainsail Client Variables (PAUSE / RESUME / CANCEL Configuration)
# Configured specifically for Dragon UHF to prevent heat creep
# -------------------------------------------------------------------

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True   ; Use custom park coordinates for pause/cancel
variable_custom_park_x    : 175.0  ; Center X for easy access / filament swap
variable_custom_park_y    : 10.0   ; Front Y for easy access
variable_custom_park_dz   : 15.0   ; Safe 15mm Z hop
variable_retract          : 1.2    ; 1.2mm anti-ooze micro-retraction (NEVER 5mm on Dragon UHF)
variable_cancel_retract   : 1.2    ; 1.2mm anti-ooze micro-retraction on cancel
variable_speed_retract    : 35.0   ; Retract speed in mm/s
variable_unretract        : 1.2    ; Restore 1.2mm on resume
variable_speed_unretract  : 35.0   ; Unretract speed in mm/s
variable_speed_hop        : 15.0   ; Z hop speed in mm/s
variable_speed_move       : 100.0  ; Move speed in mm/s
variable_park_at_cancel   : True   ; Move to rear park on cancel
variable_park_at_cancel_x : 175.0  ; Rear center X
variable_park_at_cancel_y : 305.0  ; Rear Y (safe for 310mm travel limit)
variable_idle_timeout     : 180    ; Drop hotend after 3 minutes in pause to prevent heat creep
variable_runout_sensor    : "filament_switch_sensor filament_sensor"
gcode:

# -------------------------------------------------------------------
# Basic Toolhead Positioning & Gantry Leveling
# -------------------------------------------------------------------

[gcode_macro PARK]
description: Park toolhead in center of build volume at safe height
gcode:
    {% set th = printer.toolhead %}
    G90
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z50 F6000

[gcode_macro G32]
description: Full home, QGL, re-home Z, and park toolhead
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32

#####################################################################
#   PRINT_START Macro
#   Anti-Heat-Creep Architecture for Phaetus Dragon UHF + Voron Tap
#####################################################################

[gcode_macro PRINT_START]
description: Anti-heat-creep start cycle: cold soak, low-temp Tap probe, zero-dwell final heatup & immediate purge
gcode:
    # Fetch parameters from slicer
    {% set target_bed = params.BED|default(60)|int %}
    {% set target_extruder = params.EXTRUDER|default(200)|int %}
    {% set target_chamber = params.CHAMBER|default("40")|int %}
    {% set material = params.MATERIAL|default("")|upper %}
    {% set soak_param = params.SOAK|default(-1)|int %}

    {% set th = printer.toolhead %}
    {% set x_wait = th.axis_maximum.x|float / 2 %}
    {% set y_wait = th.axis_maximum.y|float / 2 %}

    # -----------------------------------------------------------------
    # STEP 1: SAFETY INITIALIZATION & COLD SOAK PREP
    # -----------------------------------------------------------------
    # Force extruder heater OFF immediately to cancel any rogue pre-heat
    # commands injected by slicers before PRINT_START.
    # The hotend MUST stay cold (0C) during bed heatsoak and homing!
    M104 S0
    M107                                                ; Ensure part cooling fan is off
    BED_MESH_CLEAR                                      ; Clear old bed mesh

    # Determine safe Voron Tap probing temperature based on material:
    # - PLA / TPU (target <= 215C): 120C softens nozzle debris without liquefying
    #   PLA or inducing heat creep during QGL/mesh.
    # - ABS / ASA / PETG / Nylon (target > 215C): 150C standard Tap softening temp.
    {% if material == "PLA" or (material == "" and target_extruder <= 215) %}
        {% set probe_temp = 120 %}
    {% else %}
        {% set probe_temp = 150 %}
    {% endif %}

    # -----------------------------------------------------------------
    # STEP 2: FULL HOMING & BED HEATSOAK (HOTEND OFF)
    # -----------------------------------------------------------------
    STATUS_HOMING
    G28                                                 ; Full XYZ home
    G90                                                 ; Absolute positioning

    # Park toolhead high at Z70 in bed center so radiant bed heat does not bake
    # the cold block, Clockwork2 extruder, or Tap optical sensor.
    G0 X{x_wait} Y{y_wait} Z70 F9000

    {% if target_bed > 90 %}
        # Enclosed / High-temp bed (ABS/ASA): circulate air with BedFans & Nevermore
        SET_DISPLAY_TEXT MSG="Bed heating: {target_bed}c"
        STATUS_HEATING
        BEDFANSFAST                                     ; Underbed circulation fans
        NEVERMORE_FAST                                  ; Nevermore air filter / circulation
        M190 S{target_bed}                              ; Wait for bed temperature

        # Soak duration: user override (SOAK=X) or default 2 minutes if bed was cold.
        # BedFans circulate heat rapidly, so 2-3 minutes is plenty for bed thermal expansion.
        {% set soak_time = soak_param if soak_param >= 0 else 2 %}
        {% if (printer.heater_bed.temperature | round(1)) < (target_bed - 2) and soak_time > 0 %}
            SET_DISPLAY_TEXT MSG="Heatsoaking bed ({soak_time}m)..."
            {% for i in range(soak_time) %}
                SET_DISPLAY_TEXT MSG="Heatsoak: {soak_time - i}m left"
                G4 P60000
            {% endfor %}
        {% else %}
            SET_DISPLAY_TEXT MSG="Bed ready, skipping soak"
        {% endif %}

    {% else %}
        # Open / Low-temp bed (PLA/PETG/TPU): NO SOAK NEEDED (starts immediately!)
        SET_DISPLAY_TEXT MSG="Bed heating: {target_bed}c"
        STATUS_HEATING
        M190 S{target_bed}
        # Only soak if user explicitly passed SOAK > 0
        {% if soak_param > 0 %}
            SET_DISPLAY_TEXT MSG="Stabilizing ({soak_param}m)..."
            G4 P{soak_param * 60000}
        {% endif %}
    {% endif %}

    # -----------------------------------------------------------------
    # STEP 3: PIPELINED GANTRY LEVELING & MESH (LOW-TEMP TAP PROBE)
    # -----------------------------------------------------------------
    # Heat nozzle ONLY to the minimum safe probe temp right before probing
    SET_DISPLAY_TEXT MSG="Probe warmup: {probe_temp}c"
    STATUS_HEATING
    M109 S{probe_temp}

    # Quad Gantry Leveling
    SET_DISPLAY_TEXT MSG="QGL Leveling"
    STATUS_LEVELING
    quad_gantry_level

    # Re-home Z after leveling gantry
    SET_DISPLAY_TEXT MSG="Re-homing Z"
    G28 Z

    # Adaptive Bed Mesh (fast and local to the printed part)
    SET_DISPLAY_TEXT MSG="Adaptive Bed Mesh"
    STATUS_MESHING
    BED_MESH_CALIBRATE ADAPTIVE=1

    # -----------------------------------------------------------------
    # STEP 4: ZERO-DWELL TRANSITION TO PRINT TEMPERATURE
    # -----------------------------------------------------------------
    # Move to the purge start coordinates BEFORE heating to print temp.
    # This prevents oozing on the bed and eliminates stationary dwell at 250C.
    SET_DISPLAY_TEXT MSG="Moving to purge start"
    G0 X25 Y4 Z0.8 F12000

    # Heat to final print temperature at the purge position
    SET_DISPLAY_TEXT MSG="Heating: {target_extruder}c"
    STATUS_HEATING
    M109 S{target_extruder}

    # -----------------------------------------------------------------
    # STEP 5: INSTANT PURGE & PRINT (FLOW COOLS THE HEATBREAK)
    # -----------------------------------------------------------------
    # Start extrusion immediately upon hitting temperature!
    SET_DISPLAY_TEXT MSG="Purging nozzle..."
    STATUS_PRINTING

    G92 E0                                              ; Zero extruder
    G0 Z0.3 F1800                                       ; Drop to first layer height

    # Two-pass anti-blob purge line
    # Pass 1: Extrude forward 100mm
    G1 X125 E15 F1200
    # Small Y shift
    G0 Y4.4 F6000
    # Pass 2: Extrude back 80mm
    G1 X45 E12 F1200
    # Quick anti-string wipe
    G1 E-0.4 F1800                                      ; Tiny micro-retract
    G0 X40 F9000                                        ; Fast wipe off bead
    G92 E0                                              ; Zero extruder

    SET_DISPLAY_TEXT MSG="Printing..."

#####################################################################
#   PRINT_END Macro
#   Anti-Hourglass-Plug Procedure for Direct-Drive / Dragon UHF
#####################################################################

[gcode_macro PRINT_END]
description: Anti-heat-creep end print procedure: 1.2mm micro-retract, instant heater cutoff, safe high park
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    # Lift Z at least 20mm, and ensure toolhead is at least Z50 above bed
    {% set z_safe = [th.position.z + 20, 50]|max %}
    {% set z_safe = [z_safe, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                                                ; Wait for buffer to clear

    # -----------------------------------------------------------------
    # CRITICAL: 1.2mm anti-ooze micro-retraction ONLY.
    # NEVER retract 5mm on a direct-drive / Dragon UHF hotend!
    # Retracting 5mm pulls molten plastic past the heatbreak into the cold
    # bore, freezing into an hourglass plug when heaters turn off.
    # -----------------------------------------------------------------
    {% if printer.extruder.can_extrude %}
        M83                                             ; Relative extrusion
        G1 E-1.2 F1800                                  ; Relieve nozzle pressure safely
    {% endif %}

    # IMMEDIATELY turn off extruder heater to prevent heat creeping up while stationary
    M104 S0
    M140 S0                                             ; Turn off bed heater

    # Wipe nozzle and lift high away from hot bed
    G90                                                 ; Absolute positioning
    G0 X{x_safe} Y{y_safe} F20000                       ; Wipe move to snap any fine string
    G0 Z{z_safe} F3000                                  ; Lift nozzle away from radiant bed heat
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 5} F6000  ; Park nozzle at rear center

    M107                                                ; Turn off part cooling fan
    BED_MESH_CLEAR
    BEDFANSOFF

    # Hotend cooling fan on EBBCan continues running at 100% until extruder drops below 50C
    SET_DISPLAY_TEXT MSG="Print complete - hotend cooling"
    STATUS_READY

    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
    M84                                                 ; Disable steppers

#####################################################################
#   Filament Change (M600)
#####################################################################

[gcode_macro M600]
description: Filament change - pause, tip-shape unload, park at front, and wait for swap
gcode:
    {% set th = printer.toolhead %}
    {% set z_safe = [th.position.z + 15, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_M600
    PAUSE

    # Tip-shaping unload sequence to prevent strings / bulbs in cold zone
    {% if printer.extruder.can_extrude %}
        M83
        G1 E5 F300                                      ; Prime molten plastic
        G1 E-10 F3000                                   ; Quick snap
        G4 P2000                                        ; Freeze tip
        G1 E-50 F1000                                   ; Extract from hotend
    {% endif %}

    G90
    G0 Z{z_safe} F1200
    G0 X{th.axis_maximum.x//2} Y{th.axis_minimum.y + 10} F6000  ; Park front center

    M400
    SET_DISPLAY_TEXT MSG="Load new filament and RESUME"
    STATUS_BUSY

    RESTORE_GCODE_STATE NAME=STATE_M600

#####################################################################
#   Filament Load / Unload Macros with Anti-Heat-Creep Tip Shaping
#####################################################################

[gcode_macro UNLOAD_FILAMENT]
description: Heat hotend (if needed), shape tip with cold-snap technique, and retract filament from toolhead
gcode:
    {% set target = params.TEMP|default(230)|int %}
    {% set cur_temp = printer.extruder.temperature %}
    {% set target_temp = printer.extruder.target %}
    {% set heat_temp = [target, target_temp]|max %}

    SAVE_GCODE_STATE NAME=STATE_UNLOAD_FILAMENT

    # Heat up hotend if below 200C or below requested target
    {% if cur_temp < 200 or cur_temp < heat_temp %}
        SET_DISPLAY_TEXT MSG="Heating to {heat_temp}c..."
        STATUS_HEATING
        M109 S{heat_temp}
    {% endif %}

    SET_DISPLAY_TEXT MSG="Tip shaping & unloading..."
    STATUS_BUSY
    M83                                                 ; Relative extrusion

    # -------------------------------------------------------------
    # Dragon UHF Cold-Snap Tip Shaping:
    # Produces a clean spear tip without swollen bulbs or stringing
    # -------------------------------------------------------------
    G1 E10 F300                                         ; Step 1: Prime forward 10mm
    G1 E-10 F3000                                       ; Step 2: Rapid 10mm cooling snap
    G4 P2500                                            ; Step 3: Dwell 2.5s to freeze tip in throat
    G1 E3 F1000                                         ; Step 4: Dip back 3mm to push back strings
    G1 E-25 F3000                                       ; Step 5: Fast pull through heatbreak
    G1 E-60 F1000                                       ; Step 6: Smoothly draw out through CW2 gears
    M400

    # Turn off extruder heater immediately to prevent heat creep while idle
    M104 S0
    SET_DISPLAY_TEXT MSG="Filament unloaded!"
    STATUS_READY
    RESTORE_GCODE_STATE NAME=STATE_UNLOAD_FILAMENT

[gcode_macro LOAD_FILAMENT]
description: Heat hotend (if needed), feed filament into toolhead, and purge
gcode:
    {% set target = params.TEMP|default(230)|int %}
    {% set cur_temp = printer.extruder.temperature %}
    {% set target_temp = printer.extruder.target %}
    {% set heat_temp = [target, target_temp]|max %}

    SAVE_GCODE_STATE NAME=STATE_LOAD_FILAMENT

    # Heat up hotend if below 200C or below requested target
    {% if cur_temp < 200 or cur_temp < heat_temp %}
        SET_DISPLAY_TEXT MSG="Heating to {heat_temp}c..."
        STATUS_HEATING
        M109 S{heat_temp}
    {% endif %}

    SET_DISPLAY_TEXT MSG="Loading filament..."
    STATUS_BUSY
    M83                                                 ; Relative extrusion
    G1 E50 F400                                         ; Feed filament down to melt zone
    G1 E40 F150                                         ; Purge old filament
    G1 E-1.2 F1800                                      ; Safe 1.2mm anti-ooze micro-retract
    M400
    SET_DISPLAY_TEXT MSG="Filament loaded!"
    STATUS_READY
    RESTORE_GCODE_STATE NAME=STATE_LOAD_FILAMENT

#####################################################################
#   Preheat / Chamber Warmup Macros (Anti-Heat-Creep Protected)
#####################################################################

[gcode_macro PREHEAT]
description: Preheats bed and chamber, turns on Nevermore & circulation fans, and parks toolhead high (Hotend kept COLD)
gcode:
    {% set BED = params.BED|default(105)|int %}
    {% set EXTRUDER = params.EXTRUDER|default(0)|int %}
    {% set SOAK = params.SOAK|default(0)|int %}
    {% set th = printer.toolhead %}
    {% set x_center = th.axis_maximum.x / 2 %}
    {% set y_center = th.axis_maximum.y / 2 %}

    STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Preheating: Bed {BED}c (Hotend OFF)"

    # Home XYZ if not already homed so toolhead can safely park in center
    {% if "xyz" not in printer.toolhead.homed_axes %}
        STATUS_HOMING
        G28
    {% endif %}

    # Park toolhead HIGH in center (Z80) away from bed radiant heat
    G90
    G0 X{x_center} Y{y_center} Z80 F6000

    # Start bed heating
    M140 S{BED}

    # Force extruder OFF during preheat by default to prevent Dragon UHF heat creep
    {% if EXTRUDER > 0 %}
        {action_respond_info("WARNING: Heating hotend during preheat will cause heat creep on Dragon UHF! Recommended: EXTRUDER=0")}
        M104 S{EXTRUDER}
    {% else %}
        M104 S0
    {% endif %}

    # Enable Nevermore filter for chamber air circulation if bed >= 90C
    {% if BED >= 90 %}
        NEVERMORE_FAST
    {% else %}
        NEVERMORE_OFF
    {% endif %}
    M107                                                ; Part fan OFF

    # Optional soak countdown (if SOAK > 0 was specified, e.g. PREHEAT SOAK=15)
    {% if SOAK > 0 %}
        SET_DISPLAY_TEXT MSG="Waiting for Bed {BED}c..."
        M190 S{BED}
        SET_DISPLAY_TEXT MSG="Heatsoaking {SOAK}m..."
        {% for i in range(SOAK) %}
            SET_DISPLAY_TEXT MSG="Heatsoak: {SOAK - i}m left"
            G4 P60000
        {% endfor %}
        SET_DISPLAY_TEXT MSG="Heatsoak complete! Ready to print."
        STATUS_READY
    {% else %}
        SET_DISPLAY_TEXT MSG="Preheat active: Bed {BED}c (Hotend OFF)"
    {% endif %}

[gcode_macro PREHEAT_OFF]
description: Turn off heaters, Nevermore, circulation fans, and lights
gcode:
    TURN_OFF_HEATERS
    M107
    NEVERMORE_OFF
    BEDFANSOFF
    STATUS_OFF
    SET_DISPLAY_TEXT MSG="Preheat off / cooling down"
