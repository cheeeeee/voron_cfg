#####################################################################
#   Macros
#####################################################################

[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30  

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32
   
#[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
#gcode:
#    G32                            ; home all axes
#    G90                            ; absolute positioning
#    G1 Z20 F3000                   ; move nozzle away from bed
   
#####################################################################
#   print_start macro
#####################################################################

## *** THINGS TO UNCOMMENT: ***
## Bed mesh (2 lines at 2 locations)
## Z_TILT_ADJUST if your printer is a Trident
## Quad gantry level if your printer is a V2
## Nevermore - if you have one

[gcode_macro PRINT_START]
# Source https://github.com/jontek2/A-better-print_start-macro
gcode:
  # This part fetches data from your slicer. Such as bed temp, extruder temp, chamber temp and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("40")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  # Homes the printer, sets absolute positioning and updates the Stealthburner leds.
  STATUS_HOMING         # Sets SB-leds to homing-mode
  G28                   # Full home (XYZ)
  G90                   # Absolut position

  ##  Uncomment for bed mesh (1 of 2)
  BED_MESH_CLEAR       # Clears old saved bed mesh (if any)

  # Checks if the bed temp is higher than 90c - if so then trigger a heatsoak.
  {% if params.BED|int > 90 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
    STATUS_HEATING                                      # Sets SB-leds to heating-mode
    M106 S255                                           # Turns on the PT-fan

    ##  Underbed fans and Nevermore filter
    BEDFANSFAST                                         # Turns on the underbed fans
    NEVERMORE_FAST                                      # Turns on the Nevermore filter

    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed
    M190 S{target_bed}                                  # Sets the target temp for the bed
    
    # Only soak if bed was cold / not already preheated
    {% if (printer.heater_bed.temperature | round(1)) < (target_bed - 2) %}
      SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"  # Displays info
      {% if 'temperature_sensor chamber' in printer %}
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}
      {% else %}
        G4 P300000                                        # Soak for 5min if no chamber sensor
      {% endif %}
    {% else %}
      SET_DISPLAY_TEXT MSG="Bed already hot, skipping soak"
    {% endif %}

  # If the bed temp is not over 90c, then it skips the heatsoak and just heats up to set temp
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Displays info
    STATUS_HEATING                                      # Sets SB-leds to heating-mode
    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Goes to center of the bed
    M190 S{target_bed}                                  # Sets the target temp for the bed
    {% if (printer.heater_bed.temperature | round(1)) < (target_bed - 2) %}
      SET_DISPLAY_TEXT MSG="Soak for 5min"                # Displays info
      G4 P300000                                          # Waits 5 min for the bedtemp to stabilize
    {% endif %}
  {% endif %}

  # Heating nozzle to 150 degrees. This helps with getting a correct Z-home
  SET_DISPLAY_TEXT MSG="Hotend: 150c"          # Displays info
  M109 S150                                    # Heats the nozzle to 150c

  ##  Uncomment for Trident (Z_TILT_ADJUST)
  #SET_DISPLAY_TEXT MSG="Z-tilt adjust"     # Displays info
  #STATUS_LEVELING                          # Sets SB-leds to leveling-mode
  #Z_TILT_ADJUST                            # Levels the buildplate via z_tilt_adjust
  #G28 Z                                    # Homes Z again after z_tilt_adjust

  ##  Uncomment for V2 (Quad gantry level AKA QGL)
  SET_DISPLAY_TEXT MSG="QGL"      # Displays info
  STATUS_LEVELING                 # Sets SB-leds to leveling-mode
  quad_gantry_level               # Levels the buildplate via QGL
  G28 Z                           # Homes Z again after QGL

  ##  Uncomment for Klicky auto-z
  #CALIBRATE_Z                                 # Calibrates Z-offset with klicky
  #SET_DISPLAY_TEXT MSG="Z-offset"             # Displays info

  ##  Uncomment for bed mesh (2 of 2)
  SET_DISPLAY_TEXT MSG="Bed mesh"    # Displays info
  STATUS_MESHING                     # Sets SB-leds to bed mesh-mode
  BED_MESH_CALIBRATE ADAPTIVE=1                # Starts bed mesh

  # Heats up the nozzle up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"             # Displays info
  STATUS_HEATING                                                # Sets SB-leds to heating-mode
  G1 X{x_wait} Y{y_wait} Z15 F9000                              # Goes to center of the bed
  M107                                                          # Turns off partcooling fan
  M109 S{target_extruder}                                       # Heats the nozzle to printing temp

  # Gets ready to print by doing a purge line and updating the SB-leds
  SET_DISPLAY_TEXT MSG="Printer goes brr"          # Displays info
  STATUS_PRINTING                                  # Sets SB-leds to printing-mode
  G0 X{x_wait - 50} Y4 F10000                      # Moves to starting point
  G0 Z0.4                                          # Raises Z to 0.4
  G91                                              # Incremental positioning 
  G1 X100 E20 F1000                                # Purge line
  G90                                              # Absolut position


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    BED_MESH_CLEAR

    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
    M84

#####################################################################
#   Filament Change (M600)
#####################################################################

[gcode_macro M600]
description: Filament change - pause, park, and wait for swap
gcode:
    {% set th = printer.toolhead %}
    {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_M600
    PAUSE

    G91                          ; relative positioning
    G1 E-5 F2700                 ; retract 5mm quickly
    G1 E-50 F1000                ; retract 50mm to clear hotend

    G90                          ; absolute positioning
    G0 Z{z_safe} F900            ; lift Z
    G0 X{th.axis_maximum.x//2} Y{th.axis_minimum.y + 5} F6000  ; park at front center

    M400                         ; wait for moves
    SET_DISPLAY_TEXT MSG="Filament change - load new filament and RESUME"
    STATUS_BUSY

    RESTORE_GCODE_STATE NAME=STATE_M600

#####################################################################
#   Filament Load / Unload Macros
#####################################################################

[gcode_macro LOAD_FILAMENT]
description: Heat hotend (if needed), feed filament into toolhead, and purge
gcode:
    {% set target = params.TEMP|default(230)|int %}
    {% set cur_temp = printer.extruder.temperature %}
    {% set target_temp = printer.extruder.target %}
    {% set heat_temp = [target, target_temp]|max %}

    SAVE_GCODE_STATE NAME=STATE_LOAD_FILAMENT
    
    # Heat up hotend if below 200C or below requested target
    {% if cur_temp < 200 or cur_temp < heat_temp %}
        SET_DISPLAY_TEXT MSG="Heating to {heat_temp}c..."
        STATUS_HEATING
        M109 S{heat_temp}
    {% endif %}

    SET_DISPLAY_TEXT MSG="Loading filament..."
    STATUS_BUSY
    M83                            ; relative extrusion
    G1 E45 F400                    ; feed filament down to melt zone
    G1 E30 F150                    ; slow purge
    G1 E-2 F1800                   ; small retract to prevent oozing
    M400
    SET_DISPLAY_TEXT MSG="Filament loaded!"
    STATUS_READY
    RESTORE_GCODE_STATE NAME=STATE_LOAD_FILAMENT

[gcode_macro UNLOAD_FILAMENT]
description: Heat hotend (if needed), shape tip, and retract filament from toolhead
gcode:
    {% set target = params.TEMP|default(230)|int %}
    {% set cur_temp = printer.extruder.temperature %}
    {% set target_temp = printer.extruder.target %}
    {% set heat_temp = [target, target_temp]|max %}

    SAVE_GCODE_STATE NAME=STATE_UNLOAD_FILAMENT
    
    # Heat up hotend if below 200C or below requested target
    {% if cur_temp < 200 or cur_temp < heat_temp %}
        SET_DISPLAY_TEXT MSG="Heating to {heat_temp}c..."
        STATUS_HEATING
        M109 S{heat_temp}
    {% endif %}

    SET_DISPLAY_TEXT MSG="Unloading filament..."
    STATUS_BUSY
    M83                            ; relative extrusion
    G1 E5 F300                     ; small push to clear cold plug
    G1 E-15 F2400                  ; fast yank out of melt zone
    G1 E-50 F1000                  ; pull through gears
    M400
    SET_DISPLAY_TEXT MSG="Filament unloaded!"
    STATUS_READY
    RESTORE_GCODE_STATE NAME=STATE_UNLOAD_FILAMENT

#####################################################################
#   Preheat / Warmup Macros
#####################################################################

[gcode_macro PREHEAT]
description: Preheats bed and chamber, turns on Nevermore & circulation fans, and parks toolhead in center for thermal soak
gcode:
    {% set BED = params.BED|default(105)|int %}
    {% set EXTRUDER = params.EXTRUDER|default(150)|int %}
    {% set SOAK = params.SOAK|default(0)|int %}
    {% set th = printer.toolhead %}
    {% set x_center = th.axis_maximum.x / 2 %}
    {% set y_center = th.axis_maximum.y / 2 %}

    STATUS_HEATING
    SET_DISPLAY_TEXT MSG="Preheating: Bed {BED}c, Extruder {EXTRUDER}c"

    # Home XYZ if not already homed so toolhead can safely park in center
    {% if "xyz" not in printer.toolhead.homed_axes %}
        STATUS_HOMING
        G28
    {% endif %}

    # Park toolhead in center just above bed so rising heat warms gantry & Tap
    G90
    G0 X{x_center} Y{y_center} Z50 F6000

    # Start bed and nozzle heating
    M140 S{BED}
    M104 S{EXTRUDER}

    # Enable Nevermore filter and part cooling fan to circulate chamber air if bed >= 90C
    {% if BED >= 90 %}
        NEVERMORE_FAST
        M106 S128               ; 50% part cooling fan for air circulation
    {% else %}
        NEVERMORE_OFF
        M107
    {% endif %}

    # Optional soak countdown (if SOAK > 0 was specified, e.g. PREHEAT SOAK=15)
    {% if SOAK > 0 %}
        SET_DISPLAY_TEXT MSG="Waiting for Bed {BED}c..."
        M190 S{BED}
        SET_DISPLAY_TEXT MSG="Heatsoaking {SOAK}m..."
        {% for i in range(SOAK) %}
            SET_DISPLAY_TEXT MSG="Heatsoak: {SOAK - i}m left"
            G4 P60000
        {% endfor %}
        SET_DISPLAY_TEXT MSG="Heatsoak complete! Ready to print."
        STATUS_READY
    {% else %}
        SET_DISPLAY_TEXT MSG="Preheat active: Bed {BED}c, Nozzle {EXTRUDER}c"
    {% endif %}

[gcode_macro PREHEAT_OFF]
description: Turn off heaters, Nevermore, circulation fans, and lights
gcode:
    TURN_OFF_HEATERS
    M107
    NEVERMORE_OFF
    BEDFANSOFF
    STATUS_OFF
    SET_DISPLAY_TEXT MSG="Preheat off / cooling down"