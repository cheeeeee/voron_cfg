############### Nevermore Air Filter Controls ##################
# Hardware pin definition for Nevermore is configured in fans.cfg ([fan_generic Nevermore])

[gcode_macro NEVERMORE_ON]
description: Turn on Nevermore filter
gcode:
    {% set SPEED = params.SPEED|default(1.0)|float %}
    SET_FAN_SPEED FAN=Nevermore SPEED={SPEED}

[gcode_macro NEVERMORE_OFF]
description: Turn off Nevermore filter
gcode:
    SET_FAN_SPEED FAN=Nevermore SPEED=0

[gcode_macro NEVERMORE_SLOW]
description: Run Nevermore filter at slow speed
gcode:
    SET_FAN_SPEED FAN=Nevermore SPEED=0.5

[gcode_macro NEVERMORE_FAST]
description: Run Nevermore filter at full speed
gcode:
    SET_FAN_SPEED FAN=Nevermore SPEED=1.0